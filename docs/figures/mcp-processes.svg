<svg xmlns="http://www.w3.org/2000/svg" width="880" height="736" viewBox="0 0 880 736" role="img" aria-labelledby="mcp-processes-title mcp-processes-desc" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="mcp-processes-title">Processes and what crosses each boundary</title>
<desc id="mcp-processes-desc">Four groups of processes, top to bottom. The caller's MCP client speaks MCP JSON-RPC on stdio to the MCP server, which sends one runner command per tool call to the runner; the licence of those two is not decided. The runner exchanges JSON lines on a pipe with the headless client, a single GPL-3 process holding nvhttp, moonlight-common-c and a software decoder. The client reaches Wolf over HTTP and HTTPS with the client certificate, and over RTSP, the encrypted control stream and RTP. Outside the GPL-3 boundary the runner also calls the Wolf API on a local unix socket and execs a reader inside the app container, which reads the virtual input devices Wolf creates there.</desc>
