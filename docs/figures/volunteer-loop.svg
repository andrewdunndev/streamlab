<svg xmlns="http://www.w3.org/2000/svg" width="880" height="328" viewBox="0 0 880 328" role="img" aria-labelledby="volunteer-loop-title volunteer-loop-desc" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="volunteer-loop-title">The volunteer testing loop</title>
<desc id="volunteer-loop-desc">Swimlane with three owners. The maintainer labels a pull request. The bot comments the testing table. On the volunteer's side their agent scans labels and matches hardware, the volunteer approves and the agent runs the checks, and the volunteer posts the previewed result. The maintainer pulls the result.</desc>
<defs><marker id="volunteer-loop-ink" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#404040"/></marker><marker id="volunteer-loop-moss" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#4a6741"/></marker></defs>
<g font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="328" fill="#ffffff"/>
<rect x="20" y="20" width="840" height="288" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<!-- zones -->
<path d="M20,116 H860" fill="none" stroke="#e0e0e0" stroke-width="1"/><path d="M20,212 H860" fill="none" stroke="#e0e0e0" stroke-width="1"/><path d="M128,20 V308" fill="none" stroke="#e0e0e0" stroke-width="1"/>
<!-- arrows -->
<path d="M264,68 H292 Q298,68 298,74 V132" fill="none" stroke="#404040" stroke-width="1.5" marker-end="url(#volunteer-loop-ink)"/>
<path d="M360,164 H388 Q394,164 394,170 V228" fill="none" stroke="#404040" stroke-width="1.5" marker-end="url(#volunteer-loop-ink)"/>
<path d="M456,260 H480" fill="none" stroke="#404040" stroke-width="1.5" marker-end="url(#volunteer-loop-ink)"/>
<path d="M604,260 H628" fill="none" stroke="#404040" stroke-width="1.5" marker-end="url(#volunteer-loop-ink)"/>
<path d="M752,260 H780 Q786,260 786,254 V100" fill="none" stroke="#404040" stroke-width="1.5" marker-end="url(#volunteer-loop-ink)"/>
<!-- labels -->
<text x="36" y="62" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.08em" fill="#707070">MAINTAINER</text><text x="36" y="76" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#404040">steps 1 and 6</text>
<text x="36" y="158" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.08em" fill="#707070">BOT</text><text x="36" y="172" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#404040">step 2</text>
<text x="36" y="254" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.08em" fill="#707070">VOLUNTEER</text><text x="36" y="268" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#404040">steps 3 to 5</text>
<!-- nodes -->
<rect x="140" y="36" width="124" height="64" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="202" y="56.5" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.08em" fill="#707070">STEP 1</text><text x="202" y="72.5" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0a0a">Labels a</text><text x="202" y="88.5" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0a0a">pull request</text>
<rect x="236" y="132" width="124" height="64" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="298" y="152.5" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.08em" fill="#707070">STEP 2</text><text x="298" y="168.5" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0a0a">Comments the</text><text x="298" y="184.5" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0a0a">testing table</text>
<rect x="332" y="228" width="124" height="64" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="394" y="248.5" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.08em" fill="#707070">STEP 3 · AGENT</text><text x="394" y="264.5" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0a0a">Scans labels,</text><text x="394" y="280.5" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0a0a">matches hardware</text>
<rect x="480" y="228" width="124" height="64" rx="6" fill="#4a6741"/><text x="542" y="248.5" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.08em" fill="#ffffff">STEP 4</text><text x="542" y="264.5" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Approves, agent</text><text x="542" y="280.5" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">runs the checks</text>
<rect x="628" y="228" width="124" height="64" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="690" y="248.5" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.08em" fill="#707070">STEP 5</text><text x="690" y="264.5" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0a0a">Posts the</text><text x="690" y="280.5" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0a0a">previewed result</text>
<rect x="724" y="36" width="124" height="64" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="786" y="56.5" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.08em" fill="#707070">STEP 6</text><text x="786" y="72.5" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0a0a">Pulls the</text><text x="786" y="88.5" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0a0a">result</text>
</g>
</svg>
