<svg xmlns="http://www.w3.org/2000/svg" width="880" height="552" viewBox="0 0 880 552" role="img" aria-labelledby="volunteer-machine-boundary-title volunteer-machine-boundary-desc" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="volunteer-machine-boundary-title">Where the volunteer tool runs and how results are read</title>
<desc id="volunteer-machine-boundary-desc">The maintainer labels a pull request on public GitHub. The volunteer's agent reads the labelled pull request and the bot's table with a public read and drives the volunteer tool with probe, match and run. The tool pulls images by digest from the image registry, starts a test Wolf container with a scratch configuration, and a headless client container pairs, launches and sends input to it over loopback, receives the video stream over loopback and hands stats and frames back as local files. The only thing that leaves the machine is the result JSON, pasted by the volunteer into the results, which the maintainer reads on demand as one page.</desc>
