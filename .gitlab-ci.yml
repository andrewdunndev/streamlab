stages:
  - build

include:
  - component: gitlab.com/dunn.dev/pipeline/container-image@4
    inputs:
      containerfile: client/Containerfile
      image_tag: client

# The component has no MR rule and fires on every main pipeline; its rules
# are restated to add scripts/**.
build-image:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - client/**/*
        - scripts/**/*
      variables:
        VERSION: $CI_COMMIT_SHORT_SHA
    - if: $BUILD_CI_IMAGE == "true"
      variables:
        VERSION: $CI_COMMIT_SHORT_SHA

# Same builder image and isolation as the component's build job: the full
# build and asserts, no login, push or signing.
build-check:
  stage: build
  # renovate: datasource=docker depName=quay.io/buildah/stable
  image: quay.io/buildah/stable:v1.46.1-immutable@sha256:12132e724a8a5c7e6970c3fced03f3db6c8077d9afa08803df274df4cf3de846
  variables:
    BUILDAH_ISOLATION: chroot
    BUILDAH_FORMAT: oci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - client/**/*
        - scripts/**/*
  script:
    - buildah build --layers -f client/Containerfile -t build-check:mr .

test:
  stage: build
  # renovate: datasource=docker depName=docker.io/library/alpine
  image: docker.io/library/alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache bash jq python3 shellcheck coreutils
  script:
    - shellcheck -S warning bin/streamlab tests/*.sh scripts/*.sh client/hdr-dump/build.sh
    - bash tests/test-parse.sh
    - bash tests/test-game.sh
    - bash tests/test-run.sh

# Grades generated HEVC samples (Main10 PQ with mastering and light-level SEI,
# and 8-bit BT.709) through the hdr-verify evaluator, with mutation checks.
hdr-test:
  stage: build
  # renovate: datasource=docker depName=docker.io/library/alpine
  image: docker.io/library/alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache bash jq ffmpeg coreutils
  script:
    - bash tests/test-hdr.sh
