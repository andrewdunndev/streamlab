<svg viewBox="0 0 1200 430" width="1200" height="430" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="streamlab hero: A test rig for Wolf hosts and Moonlight clients.">
  <rect x="0" y="0" width="1200" height="430" fill="#f4f4f4"/>
  <g font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <text x="60" y="34" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">TEST RIG · WOLF · MOONLIGHT</text>
  <text x="1140" y="34" text-anchor="end" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">2026</text>
  <line x1="60" y1="48" x2="1140" y2="48" stroke="#e0e0e0" stroke-width="1"/>
  <text x="60" y="138" font-size="72" font-weight="700" fill="#4a6741" letter-spacing="-2">streamlab</text>
  <text x="60" y="172" font-size="14" fill="#404040">Two hosts, one AMD and one NVIDIA,</text>
  <text x="60" y="192" font-size="14" fill="#404040">each streaming to the other.</text>
  <text x="60" y="222" font-size="12" font-style="italic" fill="#404040">Measure before you change.</text>
  <g transform="translate(110 240) scale(2.2)">
  <g stroke="#4a6741" fill="none" stroke-linecap="round">
    <rect x="10" y="14" width="44" height="10" stroke-width="1.6" rx="1"/>
    <rect x="10" y="28" width="44" height="10" stroke-width="1.6" rx="1"/>
    <rect x="10" y="42" width="44" height="10" stroke-width="1.6" rx="1"/>
  </g>
  <circle cx="16" cy="19" r="1.4" fill="#4a6741"/>
  <circle cx="16" cy="33" r="1.4" fill="#4a6741"/>
  <circle cx="16" cy="47" r="1.4" fill="#4a6741"/>
  </g>
  <text x="560" y="72" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">FLOW</text>
  <text x="850" y="72" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">DISCIPLINE</text>
  <rect x="560" y="84" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="578" y="106" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">IN</text>
  <text x="578" y="152" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">base</text>
  <text x="578" y="178" font-size="11" fill="#404040">Two hosts, same CPU and network.</text>
  <text x="578" y="200" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">WOLF HOSTS</text>
  <rect x="850" y="84" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="868" y="106" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">POSTURE</text>
  <text x="868" y="152" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">vendor</text>
  <text x="868" y="178" font-size="11" fill="#404040">AMD and NVIDIA, A/B on one variable.</text>
  <text x="868" y="200" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">DUMMY PLUG · HEADLESS</text>
  <rect x="560" y="224" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="578" y="246" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">OUT</text>
  <text x="578" y="292" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">client</text>
  <text x="578" y="318" font-size="11" fill="#404040">Moonlight in a pinned image.</text>
  <text x="578" y="340" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">DECODE ON THE HOST GPU</text>
  <rect x="850" y="224" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="868" y="246" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">LIFETIME</text>
  <text x="868" y="292" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">guard</text>
  <text x="868" y="318" font-size="11" fill="#404040">Never touch a host with a live session.</text>
  <text x="868" y="340" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">RUNTIME-ONLY · AUTO-REVERT</text>
  <line x1="60" y1="386" x2="1140" y2="386" stroke="#e0e0e0" stroke-width="1"/>
  <text x="60" y="412" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">TEST RIG · NOT A PRODUCT · MIT</text>
  <text x="1140" y="412" text-anchor="end" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">GITLAB.COM/DUNN.DEV/STREAMLAB</text>
  </g>
</svg>
